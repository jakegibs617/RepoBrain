[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repobrain"
version = "0.1.0"
description = "Local-first second brain for AI coding agents: indexes a repo into a queryable SQLite graph."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "markdown-it-py>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
repobrain = "repobrain.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["repobrain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
