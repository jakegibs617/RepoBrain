[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repobrain"
version = "0.1.0"
description = "Local-first second brain for AI coding agents: indexes a repo into a queryable SQLite graph."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jake Giberson" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "click>=8.1",
    "markdown-it-py>=3.0",
    "pathspec>=0.12,<2",
    "pyyaml>=6.0",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7,<1.14",
]

[project.optional-dependencies]
dev = [
    "hatchling>=1.27",
    "mypy>=1.14",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]
mcp = [
    "mcp>=1.0,<2",
]

[project.urls]
Homepage = "https://github.com/jakegibs617/RepoBrain"
Repository = "https://github.com/jakegibs617/RepoBrain"

[project.scripts]
repobrain = "repobrain.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["repobrain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# Tree-sitter nodes come from dynamically loaded grammars, and the extractor
# initializes its module node before these helpers run. Those runtime
# invariants would otherwise require pervasive casts.
module = ["repobrain.parsers.code_treesitter"]
disable_error_code = ["attr-defined", "return-value", "union-attr"]
