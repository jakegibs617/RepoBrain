[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repobrain"
version = "0.1.0"
description = "Local-first second brain for AI coding agents: indexes a repo into a queryable SQLite graph."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jake Giberson" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "click>=8.1",
    "markdown-it-py>=3.0",
    "pyyaml>=6.0",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
]

[project.optional-dependencies]
dev = [
    "hatchling>=1.27",
    "pytest>=8.0",
]
mcp = [
    "mcp>=1.0,<2",
]

[project.urls]
Homepage = "https://github.com/jakegibs617/RepoBrain"
Repository = "https://github.com/jakegibs617/RepoBrain"

[project.scripts]
repobrain = "repobrain.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["repobrain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
