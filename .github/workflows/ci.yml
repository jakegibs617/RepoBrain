name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked development and MCP dependencies
        run: uv sync --locked --extra dev --extra mcp
      - name: Ruff
        if: matrix.python-version == '3.11'
        run: uv run --no-sync ruff check repobrain
      - name: Mypy
        if: matrix.python-version == '3.11'
        run: uv run --no-sync mypy repobrain
      - name: Run tests
        if: matrix.python-version != '3.11'
        run: uv run --no-sync pytest
      - name: Run tests with coverage
        if: matrix.python-version == '3.11'
        run: >-
          uv run --no-sync pytest
          --cov=repobrain
          --cov-report=term-missing
          --cov-fail-under=88
      - name: Verify published quality metrics
        if: matrix.python-version == '3.11'
        run: uv run --no-sync python scripts/verify_setup_metrics.py
      - name: Measure extraction precision and recall
        if: matrix.python-version == '3.11'
        run: >-
          uv run --no-sync python scripts/evaluate_extraction.py
          tests/fixtures/small_python_app
          docs/evaluation/small-python-facts.json
